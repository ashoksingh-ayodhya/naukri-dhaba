name: Build and deploy

# GitHub Pages serves the repository root of `main`, so the static export is
# committed there after every content change or source change.

on:
  workflow_run:
    workflows: ["Scrape content"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "config/**"
      - "public/**"
      - "content/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tailwind.config.ts"
      - "tsconfig.json"
      - "postcss.config.js"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Kolkata
      NEXT_PUBLIC_SITE_URL: https://naukridhaba.in
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate content
        run: pip install -q pyyaml beautifulsoup4 lxml requests && python scraper/validate_content.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build static site
        run: npm run build

      - name: Publish build output to repository root
        if: github.event_name != 'pull_request'
        run: |
          ./scripts/publish-out.sh
          git config user.name "Naukri Dhaba Bot"
          git config user.email "bot@naukridhaba.in"
          git add -A
          git reset -q -- out node_modules .next 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Site unchanged — nothing to deploy."
            exit 0
          fi
          git commit -m "deploy: $(date +'%d %b %Y %H:%M IST')"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          echo "push failed" >&2
          exit 1
