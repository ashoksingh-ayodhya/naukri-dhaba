name: Scrape content

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
    - cron: "30 13 * * *"  # 19:00 IST
  workflow_dispatch:
    inputs:
      sitemap:
        description: "Also crawl sarkariresult sitemap (historical backfill)"
        type: boolean
        default: false
      max_details:
        description: "Maximum detail pages to fetch"
        default: "150"
      dry_run:
        description: "Fetch and parse but do not commit"
        type: boolean
        default: false

concurrency:
  group: content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s scraper/tests

      - name: Scrape
        env:
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          CF_WORKER_SECRET: ${{ secrets.CF_WORKER_SECRET }}
          SCRAPER_MAX_MINUTES: "45"
          SCRAPER_MAX_DETAILS: ${{ github.event.inputs.max_details || '150' }}
        run: |
          python scraper/sarkari_scraper.py \
            ${{ github.event.inputs.sitemap == 'true' && '--sitemap' || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Validate content
        run: python scraper/validate_content.py

      - name: Commit and push new content
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Naukri Dhaba Bot"
          git config user.email "bot@naukridhaba.in"
          git add content scraper/seen_items.json scraper/last_run.json
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          NEW=$(git diff --cached --name-only --diff-filter=A | grep -c '\.mdx$' || true)
          UPD=$(git diff --cached --name-only --diff-filter=M | grep -c '\.mdx$' || true)
          git commit -m "content: $(date +'%d %b %Y %H:%M IST') — $NEW new, $UPD updated"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          echo "push failed" >&2
          exit 1

      - name: Notify Google Indexing API
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
        run: |
          [ -n "$GOOGLE_INDEXING_SA_KEY" ] || { echo "GOOGLE_INDEXING_SA_KEY not set — skipping"; exit 0; }
          git diff HEAD~1 --name-only --diff-filter=A 2>/dev/null | grep 'content/.*\.mdx$' | while read -r f; do
            p=${f#content/}; p=${p%.mdx}
            echo "https://naukridhaba.in/${p}/"
          done > /tmp/new_urls.txt
          [ -s /tmp/new_urls.txt ] || { echo "no new URLs"; exit 0; }
          pip install -q google-auth
          python scraper/notify_indexing_api.py --key-json "$GOOGLE_INDEXING_SA_KEY" --urls-file /tmp/new_urls.txt

      - name: Show scraper log tail
        if: always()
        run: tail -n 60 scraper/logs/scraper.log || true
